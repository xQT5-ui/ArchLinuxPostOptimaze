# Оптимизация памяти для игр и мультимедиа
vm.swappiness=100
vm.vfs_cache_pressure=50
vm.page-cluster=0
# Раньше будить kswapd — меньше фризов от direct reclaim (практика System76)
vm.watermark_scale_factor=125
vm.watermark_boost_factor=0

# Оптимизация ядра в рантайме
kernel.nmi_watchdog=0

# Улучшение сетевой производительности для онлайн-игр -- влияет только на TCP (загрузки/стриминг), UDP-игры не затрагивает
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_mtu_probing=1

# Оптимизация для SSD
# 1/2 от vm.dirty_bytes
vm.dirty_background_bytes=134217728
# 256 МиБ - пропускная способность SSD
vm.dirty_bytes=268435456
